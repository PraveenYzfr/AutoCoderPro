# Laptop / local. Defaults match production retrieval (qdrant + gemini) so bugs
# that only show up against the real stack are reachable here too.
# Lightweight opt-in: set AUTOCODER_RETRIEVAL_BACKEND=memory and embedder: deterministic.

name: autocoderpro

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  orchestrator:
    image: autocoderpro/orchestrator:dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      AUTOCODER_CONFIG: /app/config/autocoder.yml
      AUTOCODER_WEBHOOKS_ENABLED: "true"
      AUTOCODER_TRIGGERS_MODE: both
      AUTOCODER_WEBHOOKS_DRY_RUN: "true"
      AUTOCODER_SANDBOX: docker
      AUTOCODER_QDRANT_URL: http://qdrant:6333
      AUTOCODER_RETRIEVAL_BACKEND: qdrant
      AUTOCODER_EMBEDDER: gemini
    depends_on:
      - qdrant
    volumes:
      - ./config/autocoder.yml:/app/config/autocoder.yml:ro
      - ./runs:/app/runs
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_data:
